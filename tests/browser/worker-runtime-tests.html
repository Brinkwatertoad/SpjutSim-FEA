<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Worker runtime tests</title>
</head>
<body>
  <p id="test-status" role="status">Running…</p>
  <nav id="application-menu"><div data-ui-menu-group data-open="false"><button data-ui-menu-button type="button" aria-expanded="false">File</button><div class="ui-menu-list"><button data-ui-menu-action="fit-view" type="button">Fit</button></div></div></nav>
  <select id="mesh-preset">
    <option value="coarse">Coarse</option>
    <option value="normal" selected>Normal</option>
    <option value="fine">Fine</option>
    <option value="custom">Custom</option>
  </select>
  <div id="mesh-custom-sizes" hidden>
    <input id="mesh-min-size" type="number">
    <input id="mesh-max-size" type="number">
  </div>
  <button id="generate-mesh-button" type="button"></button>
  <button id="cancel-mesh-button" type="button"></button>
  <button id="delete-mesh-button" type="button"></button>
  <p id="mesh-status"></p>
  <select id="viewport-mode"><option value="model">Model</option><option value="mesh">Mesh</option><option value="stress">Stress</option><option value="deformation">Deformation</option></select>
  <select id="display-style"><option value="lines">Shaded with edges</option><option value="wireframe">Wireframe</option></select>
  <select id="result-field"><option value="vonMises">von Mises</option><option value="displacementMagnitude">Displacement</option></select>
  <select id="deformation-mode"><option value="undeformed">Undeformed</option><option value="true-scale">True scale</option><option value="auto">Auto</option><option value="user">User</option></select>
  <button id="deformation-animation-toggle" type="button" aria-pressed="false" hidden>Play</button>
  <input id="deformation-scale" type="range" min="1" max="1000" value="100" hidden>
  <output id="deformation-scale-readout" hidden></output>
  <input id="mesh-overlay" type="checkbox">
  <canvas id="viewport" style="width: 240px; height: 160px"></canvas>
  <script src="../../web/vendor/three/three.min.js"></script>
  <script src="../../web/ui/shell-behaviors.js"></script>
  <script src="../../web/js/workers/worker-protocol.js"></script>
  <script src="../../web/js/geometry/rigid-orientation.js"></script>
  <script src="../../web/js/geometry/geometry-model.js"></script>
  <script src="../../web/js/mesh/volume-mesh.js"></script>
  <script src="../../web/js/mesh/mesh-display.js"></script>
  <script src="../../web/js/analysis/result-model.js"></script>
  <script src="../../web/js/analysis/constraint-stability.js"></script>
  <script src="../../web/js/analysis/analysis-document.js"></script>
  <script src="../../web/js/analysis/app-controller.js"></script>
  <script src="../../web/js/render/viewport-navigation.js"></script>
  <script src="../../web/js/render/deformation-animation.js"></script>
  <script src="../../web/js/render/viewport-controller.js"></script>
  <script src="../../web/js/ui/ui-controller.js"></script>
  <script src="../../web/js/workers/local-worker-bootstrap.js"></script>
  <script src="../../web/js/workers/mesher-client.js"></script>
  <script src="../../web/js/workers/solver-client.js"></script>
  <script src="worker-runtime-tests.js"></script>
</body>
</html>
