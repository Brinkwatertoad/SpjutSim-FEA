<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpjutSim FEA</title>
  <link rel="stylesheet" href="ui/ui-tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="fea-app" id="app-shell">
    <header class="fea-topbar">
      <div><strong>SpjutSim FEA</strong> <span id="app-status" role="status">Starting…</span></div>
      <nav aria-label="Application menus"><button type="button" disabled>File</button><button type="button" disabled>View</button></nav>
      <button class="fea-primary" type="button" disabled title="Available after model preflight">Solve</button>
    </header>
    <main class="fea-workspace">
      <aside class="fea-tools" aria-label="Analysis tools">
        <h1>Analysis</h1>
        <section>
          <h2>Geometry</h2>
          <button id="import-step-button" type="button">Import STEP…</button>
          <input id="import-step-input" type="file" accept=".step,.stp" hidden>
          <p id="geometry-status">Choose a STEP solid to begin.</p>
        </section>
        <section><h2>Material</h2><p>No material defined.</p></section>
        <section><h2>Supports &amp; loads</h2><p>Import geometry to begin.</p></section>
        <section><h2>Mesh</h2><p>Not generated.</p></section>
      </aside>
      <section class="fea-canvas" aria-label="3D viewport">
        <canvas id="viewport"></canvas>
        <div class="fea-empty-state" id="viewport-empty-state"><strong>Viewport ready</strong><span>Local Three.js reference scene</span></div>
      </section>
      <aside class="fea-results" aria-label="Analysis output">
        <div role="tablist" aria-label="Output views">
          <button role="tab" aria-selected="true">Results</button>
          <button role="tab" aria-selected="false">Convergence</button>
          <button role="tab" aria-selected="false">Diagnostics</button>
        </div>
        <p>No analysis results.</p>
        <dl class="fea-diagnostics"><dt>Launch mode</dt><dd id="launch-mode">Detecting…</dd><dt>Worker</dt><dd id="worker-status">Pending</dd><dt>WebAssembly</dt><dd id="wasm-status">Pending</dd></dl>
      </aside>
    </main>
  </div>
  <script src="ui/color-schemes.js"></script>
  <script src="ui/custom-select.js"></script>
  <script src="ui/overflow-menu.js"></script>
  <script src="ui/settings-hub.js"></script>
  <script src="ui/settings-controls.js"></script>
  <script src="ui/action-controls.js"></script>
  <script src="ui/tooltips.js"></script>
  <script src="ui/shell-behaviors.js"></script>
  <script src="vendor/three/three.min.js"></script>
  <script src="js/workers/worker-protocol.js"></script>
  <script src="js/geometry/geometry-model.js"></script>
  <script src="js/analysis/analysis-document.js"></script>
  <script src="js/analysis/app-controller.js"></script>
  <script src="js/render/viewport-controller.js"></script>
  <script src="js/ui/ui-controller.js"></script>
  <script src="generated/local-runtime/gmsh-runtime-source.js"></script>
  <script src="generated/local-runtime/mesher-worker-source.js"></script>
  <script src="generated/local-runtime/solver-worker-source.js"></script>
  <script src="js/workers/local-worker-bootstrap.js"></script>
  <script src="js/workers/mesher-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
